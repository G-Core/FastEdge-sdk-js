# URL attack patterns, compiled by regexped into a standalone Wasm component (urlguard.wasm)
# that exports the WIT interface regexped:urlguard/sets. Rebuild: npm run build:component
wasm_format:   component
import_module: "urlguard"
wasm_file:     "urlguard.wasm"

patterns:
  - name: "sql_injection"
    regexp: '(?i)(?:union\s+select|exec\s*\(|xp_cmdshell|drop\s+table|insert\s+into|delete\s+from|select\s+\*\s+from)'

  - name: "path_traversal"
    regexp: '(?i)(?:\.\./|\.\.\\|%2e%2e%2f|%252e%252e|%2e%2e/)'

  - name: "xss"
    regexp: '(?i)(?:<\s*(?:script|iframe|object|embed)\b[^>]*>|\bon\w{1,30}\s*=|(?:javascript|vbscript)\s*:|eval\s*\()'

  - name: "log4shell"
    regexp: '\$\{(?:jndi|lower|upper|env|sys|java)\s*:'

  - name: "template_injection"
    regexp: '(?:\{\{[^}]+\}\}|\{%[^%]+%\}|\$\{[^}]+\}|#\{[^}]+\})'

sets:
  - name: "attacks"
    scan_any: "scan_url"
    patterns: all
