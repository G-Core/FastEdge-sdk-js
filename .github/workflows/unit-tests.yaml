name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit_tests:
    # GitHub-hosted: no internal (gc.onl) access needed, and reachable from
    # fork pull requests via pr-tests.yaml. Also lets the three Node versions
    # run in parallel instead of queueing on limited self-hosted capacity.
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node Environment
        uses: ./.github/setup-node
        with:
          node_version: ${{ matrix.node-version }}

      - name: Unit Tests
        run: |
          pnpm run test:unit
