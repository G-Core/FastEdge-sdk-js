packages:
  - github-pages
  - examples/*

ignoredBuiltDependencies:
  - '@swc/core'

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  '@gcoredev/fastedge-sdk-js': link:.
  '@babel/core': '^7.29.6'
  # Transitive-only advisory fixes. None of these reach the published package
  # (files: types/, bin/*.js, lib/*.js, lib/*.wasm, README.md) - they are workspace/dev-tree only.
  fast-uri: '^3.1.6'
  brace-expansion: '^5.0.9'
  js-yaml: '^4.3.2'
  browserslist: '^4.28.7'
  baseline-browser-mapping: '^2.11.0'
  svgo: '^4.1.0'
  smol-toml: '^1.7.1'
  postcss: '^8.5.23'
  postcss-selector-parser: '^6.1.3'
  nanoid: '^3.3.18'
  ip-address: '^10.3.1'
  qs: '^6.16.0'
  path-to-regexp: '^8.4.0'
  undici: '^7.29.0'
  '@hono/node-server': '^1.19.15'
  body-parser: '^2.3.0'
  '@humanfs/node': '^0.16.8'
