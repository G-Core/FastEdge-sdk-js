[package]
name = "component_tools"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
anyhow = "1"
wac-graph = { version = "0.12.0", default-features = false }
wit-bindgen = "0.63.0"
wit-component = "0.262.0"
wit-parser = "0.262.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
